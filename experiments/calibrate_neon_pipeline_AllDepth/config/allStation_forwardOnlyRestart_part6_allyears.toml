# Forward-only restart for part6 stations.
#   - same stations/years as allStation_part6_allyears.toml,
#   - labile_depth_scale seeded once at the top level (so it is NOT pinned to 0),
#   - each run restarts from a previous run's posterior (restart_from).

[settings]
spinup_days  = 20
n_iterations = 10
cal_depth    = 0.02
settingsdesc = "NeonExp_main20260611_wLabile_flagSpring"
dt           = 900.0
output_root  = "/kiwi-data/Data/groupMembers/evametz/ClimaLand_Output/Neon_calibration"
results_csv  = "calibration_results.csv"
run_identifier = "20260629_1000"       # stable id so restart_from can reference it

[steps]
generate_observations = true
calibrate             = false
plot_eki_diagnostics  = false
run_prior_mean        = true

[priors.soilCO2_reference_rate]
mean  = 1.0e-7
std   = 5.0e-8
lower = 1.0e-12
upper = 1.0e-6

[priors.soilCO2_activation_energy]
mean  = 110550.0
std   = 40000.0
lower = 10.0
upper = 200000.0

[priors.michaelis_constant]
mean  = 0.04
std   = 0.02
lower = 0.0
upper = "Inf"

[priors.O2_michaelis_constant]
mean  = 0.04
std   = 0.02
lower = 0.0
upper = "Inf"

# ← the key addition: include labile so it is NOT pinned to 0 and IS seeded
[priors.labile_depth_scale]
mean = 0.0
std = 1.0
lower = -2.0
upper = 10.0


[[runs]]
site  = "NEON-kona"
years = [2018, 2019, 2020, 2021, 2022, 2023, 2024]
restart_from = "20260627_1300"

[[runs]]
site  = "NEON-leno"
years = [2018, 2019, 2020, 2021, 2022, 2023, 2024]
restart_from = "20260627_1300"

[[runs]]
site  = "NEON-mlbs"
years = [2018, 2019, 2020, 2021, 2022, 2023, 2024]
restart_from = "20260627_1300"

[[runs]]
site  = "NEON-ornl"
years = [2018, 2019, 2020, 2021, 2022, 2023, 2024]
restart_from = "20260627_1300"
