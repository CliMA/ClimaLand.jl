name: Downstream
on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:

# Needed to allow julia-actions/cache to delete old caches that it has created
permissions:
  actions: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: downstream ClimaCoupler.jl
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1.12'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - name: Cache Julia depot
        uses: actions/cache@v6
        with:
          # Cache Julia's depot
          path: |
            ~/.julia/packages
            ~/.julia/compiled
            ~/.julia/artifacts
            ~/.julia/scratchspaces
            ~/.julia/registries
            ~/.julia/logs
          # The cache key includes the OS, Julia version, and the project's dependencies
          key: ubuntu-latest-julia-${{ matrix.version }}-${{ hashFiles('**/Project.toml', '**/Manifest.toml') }}
          # Fallback to a depot of the same Julia version only; the compiled
          # caches of another version do not apply
          restore-keys: |
            ubuntu-latest-julia-${{ matrix.version }}-
      - uses: julia-actions/julia-buildpkg@v1
      - uses: actions/checkout@v7
        with:
          repository: 'CliMA/ClimaCoupler.jl'
          path: ClimaCoupler.jl

      # Color output stays off: on Julia 1.12, precompiling the standard
      # libraries at -O0 into an empty depot can overflow the stack while
      # printing colored output
      - run: |
          julia -O0 --project=ClimaCoupler.jl/experiments/AMIP/ -e 'using Pkg; Pkg.instantiate()'
          julia -O0 --project=ClimaCoupler.jl/experiments/AMIP/ -e 'using Pkg; Pkg.develop(; path = ".")'
          julia -O0 --project=ClimaCoupler.jl/experiments/AMIP/ ClimaCoupler.jl/experiments/test/runtests.jl
